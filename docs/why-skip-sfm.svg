<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d8797"/>
    </marker>
    <marker id="arwLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e0574a"/>
    </marker>
  </defs>

  <rect width="920" height="480" rx="14" fill="#12151c"/>

  <text x="460" y="52" text-anchor="middle" fill="#f2f5f8" font-size="26" font-weight="700">The dumbest loop in the splat pipeline</text>
  <text x="460" y="80" text-anchor="middle" fill="#8d97a6" font-size="15">Structure-from-motion, run on footage you rendered yourself</text>

  <!-- 1. Blender -->
  <rect x="34" y="126" width="190" height="150" rx="11" fill="#1b2029" stroke="#2f3846"/>
  <text x="129" y="152" text-anchor="middle" fill="#6fb2ff" font-size="11" font-weight="700" letter-spacing="1.6">BLENDER</text>
  <g transform="translate(105,166)" fill="none" stroke="#cfd6e0" stroke-width="2">
    <rect x="0" y="4" width="30" height="21" rx="3"/>
    <path d="M30 12 L44 5 L44 24 L30 17 z"/>
    <circle cx="15" cy="14.5" r="5.5"/>
  </g>
  <text x="129" y="222" text-anchor="middle" fill="#cfd6e0" font-size="12.5">You know the camera</text>
  <text x="129" y="245" text-anchor="middle" fill="#7ee0a8" font-size="11.5" font-family="Consolas, 'SF Mono', Menlo, monospace">12.400, -8.100, 3.000</text>
  <text x="129" y="263" text-anchor="middle" fill="#7ee0a8" font-size="10.5" font-weight="700" letter-spacing="1">EXACT</text>

  <line x1="228" y1="201" x2="264" y2="201" stroke="#7d8797" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 2. Render -->
  <rect x="270" y="126" width="190" height="150" rx="11" fill="#1b2029" stroke="#2f3846"/>
  <text x="365" y="152" text-anchor="middle" fill="#6fb2ff" font-size="11" font-weight="700" letter-spacing="1.6">RENDER</text>
  <g transform="translate(340,166)" fill="none" stroke="#cfd6e0" stroke-width="2">
    <rect x="0" y="2" width="44" height="30" rx="3"/>
    <path d="M4 26 L15 14 L23 22 L31 15 L40 26"/>
    <circle cx="32" cy="10" r="3.5"/>
  </g>
  <text x="365" y="222" text-anchor="middle" fill="#cfd6e0" font-size="12.5">2000 frames of pixels</text>
  <text x="365" y="248" text-anchor="middle" fill="#e0574a" font-size="11.5">camera data: discarded</text>

  <line x1="464" y1="201" x2="500" y2="201" stroke="#7d8797" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 3. SfM -->
  <rect x="506" y="126" width="190" height="150" rx="11" fill="#1b2029" stroke="#2f3846"/>
  <text x="601" y="152" text-anchor="middle" fill="#6fb2ff" font-size="11" font-weight="700" letter-spacing="1.6">COLMAP SfM</text>
  <text x="601" y="205" text-anchor="middle" fill="#cfd6e0" font-size="46" font-weight="700">?</text>
  <text x="601" y="234" text-anchor="middle" fill="#cfd6e0" font-size="12.5">"where was the camera"</text>
  <text x="601" y="256" text-anchor="middle" fill="#8d97a6" font-size="11.5">40 min of GPU time</text>

  <line x1="700" y1="201" x2="736" y2="201" stroke="#7d8797" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 4. Result -->
  <rect x="742" y="126" width="146" height="150" rx="11" fill="#241b1c" stroke="#5c3230"/>
  <text x="815" y="152" text-anchor="middle" fill="#e0574a" font-size="11" font-weight="700" letter-spacing="1.6">RESULT</text>
  <text x="815" y="190" text-anchor="middle" fill="#cfd6e0" font-size="12.5">The same camera</text>
  <text x="815" y="216" text-anchor="middle" fill="#f0a04b" font-size="10.5" font-family="Consolas, 'SF Mono', Menlo, monospace">12.38, -8.09, 3.01</text>
  <text x="815" y="240" text-anchor="middle" fill="#f0a04b" font-size="10.5" font-weight="700" letter-spacing="1">BUT WORSE</text>
  <text x="815" y="261" text-anchor="middle" fill="#8d97a6" font-size="10.5">± drift, if it solves</text>

  <!-- loop back -->
  <path d="M815 288 L815 330 Q815 342 803 342 L141 342 Q129 342 129 330 L129 292"
        fill="none" stroke="#e0574a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arwLoop)"/>
  <text x="472" y="334" text-anchor="middle" fill="#e0574a" font-size="12" font-weight="600">you already had this, 40 minutes ago</text>

  <text x="460" y="398" text-anchor="middle" fill="#f2f5f8" font-size="18" font-weight="600">You knew the answer. You rendered it away.</text>
  <text x="460" y="424" text-anchor="middle" fill="#f2f5f8" font-size="18" font-weight="600">Then paid a GPU to guess it back, slightly wrong.</text>

  <text x="460" y="456" text-anchor="middle" fill="#7d8797" font-size="12.5" font-family="Consolas, 'SF Mono', Menlo, monospace">render-splat-export &#8212; just export the poses</text>
</svg>
